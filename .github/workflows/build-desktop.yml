name: 构建桌面版

# 手动触发，或打 tag（v*）时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows 绿色版
    runs-on: windows-latest
    defaults:
      run:
        working-directory: etf-deviation-backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: 打包单文件 exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "ETF回测工具" `
            --icon "desktop/icon.ico" `
            --add-data "web;web" `
            --exclude-module tkinter `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide6 `
            --exclude-module matplotlib --exclude-module numpy --exclude-module pandas `
            desktop.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-green-exe
          path: etf-deviation-backtest/dist/ETF回测工具.exe

      - name: 附加到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "自动构建产物" || true
          gh release upload "$GITHUB_REF_NAME" "etf-deviation-backtest/dist/ETF回测工具.exe" --clobber || true

  macos:
    name: macOS 应用
    runs-on: macos-latest
    defaults:
      run:
        working-directory: etf-deviation-backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: 打包 .app 与 .dmg
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: 压缩为 zip（保留可执行权限）
        run: |
          cd dist
          ditto -c -k --keepParent "ETF回测工具.app" "ETF回测工具-macos.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            etf-deviation-backtest/dist/ETF回测工具-macos.zip
            etf-deviation-backtest/dist/ETF回测工具.dmg

      - name: 附加到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "自动构建产物" || true
          gh release upload "$GITHUB_REF_NAME" \
            "etf-deviation-backtest/dist/ETF回测工具-macos.zip" \
            "etf-deviation-backtest/dist/ETF回测工具.dmg" --clobber || true
